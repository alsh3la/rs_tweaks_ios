name: rs_tweaks_ios
description: Native iOS wrapper for RS TWEAKS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Enhanced WebView for iOS
  webview_flutter: ^4.4.2
  webview_flutter_wkwebview: ^3.0.6
  
  # UI Enhancements
  cupertino_icons: ^1.0.6
  animated_bottom_navigation_bar: ^0.3.5  # iOS-style tab bar
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0  # Loading effects
  flutter_staggered_animations: ^1.1.0  # Smooth animations
  
  # Connectivity & Offline Support
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0
  
  # Native Features
  url_launcher: ^6.2.1  # Open external links
  share_plus: ^7.2.1  # Share content
  flutter_native_splash: ^2.3.8  # Splash screen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Generate splash screen
  generate: true

  # iOS-specific assets
  assets:
    - assets/icons/
    - assets/splash/
