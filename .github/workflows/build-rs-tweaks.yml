name: Build RS Tweaks IPA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true

      - name: 🔧 Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: 📱 Create iOS Project if Missing
        run: |
          if [ ! -d "ios" ]; then
            echo "Creating iOS project..."
            flutter create --platforms=ios --org com.rstweaks --project-name rs_tweaks .
          fi

      - name: 🚫 DISABLE ALL CODE SIGNING (CRITICAL)
        run: |
          # Remove entire ios folder and recreate with no signing
          rm -rf ios
          flutter create --platforms=ios --no-pub --org com.rstweaks .
          
          # Force no signing in Xcode project
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY[sdk=iphoneos\*] = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          
          # Set signing to none
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = .*;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # Add empty development team
          sed -i '' '/DevelopmentTeam =/d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/DevelopmentTeam/d' ios/Runner.xcodeproj/project.pbxproj
          
          echo "✅ Code signing completely disabled"

      - name: ⚙️ Configure iOS Permissions
        run: |
          # Create minimal Info.plist for WebView
          cat > ios/Runner/Info.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleDisplayName</key>
    <string>RS Tweaks</string>
    <key>CFBundleExecutable</key>
    <string>\$(EXECUTABLE_NAME)</string>
    <key>CFBundleIdentifier</key>
    <string>\$(PRODUCT_BUNDLE_IDENTIFIER)</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>RS Tweaks</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleSignature</key>
    <string>????</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <key>UILaunchStoryboardName</key>
    <string>LaunchScreen</string>
    <key>UIMainStoryboardFile</key>
    <string>Main</string>
    <key>UIRequiredDeviceCapabilities</key>
    <array>
        <string>arm64</string>
    </array>
    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <key>UISupportedInterfaceOrientations~ipad</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationPortraitUpsideDown</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <!-- WEBVIEW PERMISSIONS -->
    <key>NSAppTransportSecurity</key>
    <dict>
        <key>NSAllowsArbitraryLoads</key>
        <true/>
    </dict>
    <!-- FILE SHARING -->
    <key>UIFileSharingEnabled</key>
    <true/>
    <key>LSSupportsOpeningDocumentsInPlace</key>
    <true/>
    <!-- MINIMUM IOS VERSION -->
    <key>MinimumOSVersion</key>
    <string>14.0</string>
</dict>
</plist>
EOF
          
          # Also update project settings to disable signing
          cat > ios/Flutter/Release.xcconfig << EOF
#include "Generated.xcconfig"
FLUTTER_BUILD_MODE=release
PRODUCT_BUNDLE_IDENTIFIER=com.rstweaks.app
DEVELOPMENT_TEAM=
CODE_SIGN_IDENTITY=
CODE_SIGNING_REQUIRED=NO
CODE_SIGNING_ALLOWED=NO
EOF

      - name: 🏗️ Build WITHOUT Any Signing
        run: |
          # Build with explicit no-signing flags
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=FLUTTER_BUILD_MODE=release \
            --dart-define=ENABLE_CODE_SIGNING=false
          
          echo "✅ Build completed without signing"

      - name: 🛠️ Manually Fix App Bundle
        run: |
          # Remove any signing artifacts
          rm -f build/ios/iphoneos/Runner.app/_CodeSignature/CodeResources 2>/dev/null || true
          rm -rf build/ios/iphoneos/Runner.app/_CodeSignature 2>/dev/null || true
          rm -f build/ios/iphoneos/Runner.app/embedded.mobileprovision 2>/dev/null || true
          
          # Create minimal entitlements
          cat > build/ios/iphoneos/Runner.app/entitlements.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>get-task-allow</key>
    <true/>
    <key>application-identifier</key>
    <string>com.rstweaks.app</string>
    <key>keychain-access-groups</key>
    <array>
        <string>com.rstweaks.app</string>
    </array>
</dict>
</plist>
EOF

      - name: 📦 Create IPA File
        run: |
          # Create IPA structure
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # Verify app structure
          echo "App contents:"
          ls -la Payload/Runner.app/
          
          # Create IPA (compatible with AltStore/TrollStore)
          zip -qr "RS_Tweaks_Unsigned.ipa" Payload
          
          IPA_SIZE=$(du -h "RS_Tweaks_Unsigned.ipa" | cut -f1)
          echo "✅ IPA created: RS_Tweaks_Unsigned.ipa ($IPA_SIZE)"

      - name: 🎯 Create TrollStore Version
        run: |
          # TrollStore needs specific structure
          mkdir -p TrollStore/Payload
          cp -r build/ios/iphoneos/Runner.app TrollStore/Payload/
          
          # Add TrollStore entitlements
          cat > TrollStore/Payload/Runner.app/entitlements.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>com.apple.private.security.container-required</key>
    <false/>
    <key>platform-application</key>
    <true/>
    <key>com.apple.private.skip-library-validation</key>
    <true/>
    <key>get-task-allow</key>
    <true/>
</dict>
</plist>
EOF
          
          zip -qr "RS_Tweaks_TrollStore.ipa" TrollStore
          echo "✅ TrollStore IPA created"

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RS-Tweaks-IPAs
          path: |
            RS_Tweaks_Unsigned.ipa
            RS_Tweaks_TrollStore.ipa
          retention-days: 30

      - name: 📝 Create Build Summary
        run: |
          echo "## 🎉 RS Tweaks IPA Build SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Generated IPAs:" >> $GITHUB_STEP_SUMMARY
          echo "1. **RS_Tweaks_Unsigned.ipa** - Generic unsigned IPA" >> $GITHUB_STEP_SUMMARY
          echo "2. **RS_Tweaks_TrollStore.ipa** - Optimized for TrollStore" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⬇️ How to Install:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### For TrollStore (iOS 14-16):" >> $GITHUB_STEP_SUMMARY
          echo "1. Install TrollStore on jailbroken device" >> $GITHUB_STEP_SUMMARY
          echo "2. Download `RS_Tweaks_TrollStore.ipa`" >> $GITHUB_STEP_SUMMARY
          echo "3. Open in TrollStore → Install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### For AltStore/Sideloadly:" >> $GITHUB_STEP_SUMMARY
          echo "1. Use `RS_Tweaks_Unsigned.ipa`" >> $GITHUB_STEP_SUMMARY
          echo "2. May need to resign with your own certificate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** These are UNSIGNED builds. For regular sideloading, you may need to sign them with a personal certificate." >> $GITHUB_STEP_SUMMARY
